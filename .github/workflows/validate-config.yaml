name: Validate config.yaml

on:
  workflow_call:
    inputs:
      framework-ref:
        description: 'Ref to use when checking out rimfrost-framework-regel for the schema'
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout rimfrost-framework-regel
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Forsakringskassan/rimfrost-framework-regel
          ref: ${{ inputs.framework-ref }}
          path: framework-regel

      - name: Validate config.yaml against regel schema
        run: |
          pip install check-jsonschema==0.37.3
          check-jsonschema \
            --schemafile framework-regel/src/main/resources/schema/regel_schema.yaml \
            src/main/resources/config.yaml
