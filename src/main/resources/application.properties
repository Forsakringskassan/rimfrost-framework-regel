quarkus.index-dependency.rimfrost-handlaggning-adapter.group-id=se.fk.rimfrost.framework.handlaggning
quarkus.index-dependency.rimfrost-handlaggning-adapter.artifact-id=rimfrost-framework-handlaggning-adapter
quarkus.index-dependency.rimfrost-oul-adapter.group-id=se.fk.rimfrost.framework.oul
quarkus.index-dependency.rimfrost-oul-adapter.artifact-id=rimfrost-framework-oul-adapter

# JPA / storage — disabled by default; regel repos that use KompletteringStorage
# must override quarkus.datasource.active and quarkus.hibernate-orm.enabled to true
# and supply quarkus.datasource.jdbc.url, quarkus.flyway.default-schema, etc.
quarkus.datasource.active=false
quarkus.hibernate-orm.enabled=false
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.database.default-schema=${quarkus.flyway.default-schema}
quarkus.flyway.migrate-at-start=true
quarkus.flyway.create-schemas=true
quarkus.flyway.schemas=${quarkus.flyway.default-schema}

application.config.path=src/main/resources/config.yaml

# Container image configuration
quarkus.container-image.build=true
quarkus.container-image.tag=latest
quarkus.container-image.group=rimfrost
quarkus.container-image.push=false

#Incoming
mp.messaging.incoming.regel-requests.connector=smallrye-kafka
mp.messaging.incoming.regel-requests.auto.offset.reset=earliest
mp.messaging.incoming.regel-requests.value.deserializer=se.fk.rimfrost.framework.regel.presentation.kafka.RegelRequestDeserializer

#Outgoing
mp.messaging.outgoing.regel-responses.connector=smallrye-kafka
mp.messaging.outgoing.regel-responses.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# REST setup
handlaggning.api.base-url=http://rimfrost-k8s-handlaggning:8080
