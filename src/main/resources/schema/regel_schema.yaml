$schema: "https://json-schema.org/draft/2020-12/schema"
$title: RegelSchema
type: object

required:
  - uppgift
  - specifikation
  - regel
  - lagrum

additionalProperties: false

properties:

  uppgift:
    type: object
    required:
      - version
      - aktivitet
    additionalProperties: false
    properties:
      id:
        type: string
        format: uuid
      version:
        type: integer
        minimum: 1
      path:
        type: string
        description: "Callback-URL som skickas till OUL vid skapande av operativ uppgift. Obligatorisk för manuella regler; används inte av maskinella regler."
      aktivitet:
        type: string
      metadata:
        type: object
        additionalProperties: true

  specifikation:
    type: object
    required:
      - id
      - version
      - namn
      - uppgiftbeskrivning
      - verksamhetslogik
      - roll
      - applikationsId
      - applikationsversion
    additionalProperties: false
    properties:
      id:
        type: string
        format: uuid
      version:
        type: integer
        minimum: 1
      namn:
        type: string
      uppgiftbeskrivning:
        type: string
      verksamhetslogik:
        type: string
      roll:
        type: string
      applikationsId:
        type: string
      applikationsversion:
        type: string

      metadata:
        type: object
        additionalProperties: true

  regel:
    type: object
    required:
      - id
      - version
      - namn
      - beskrivning
    additionalProperties: false
    properties:
      id:
        type: string
        format: uuid
      version:
        type: integer
        minimum: 1
      namn:
        type: string
      beskrivning:
        type: string

      metadata:
        type: object
        additionalProperties: true

  lagrum:
    type: object
    required:
      - id
      - version
      - giltigFom
      - forfattning
      - kapitel
      - paragraf
      - stycke
      - punkt
    additionalProperties: false
    properties:
      id:
        type: string
        format: uuid
      version:
        type: integer
        minimum: 1
      giltigFom:
        type: string
        format: date
      forfattning:
        type: string
      kapitel:
        type: integer
        minimum: 1
      paragraf:
        type: integer
        minimum: 1
      stycke:
        type: integer
        minimum: 1
      punkt:
        type: integer
        minimum: 1

      metadata:
        type: object
        additionalProperties: true

  utokadUppgiftsbeskrivning:
    type: object
    additionalProperties: false
    properties:
      beskrivning:
        type: string
