application.config.path=src/test/resources/config-test.yaml

# Kafka

kafka.source=Regel

#Incoming
mp.messaging.incoming.regel-requests.connector=smallrye-in-memory
mp.messaging.incoming.regel-requests.topic=regel-request

#Outgoing
mp.messaging.outgoing.regel-responses.connector=smallrye-in-memory
mp.messaging.outgoing.regel-responses.topic=regel-response

# Storage (test) — opt in to datasource and ORM for komplettering storage tests
quarkus.datasource.active=true
quarkus.hibernate-orm.enabled=true
quarkus.flyway.default-schema=regel_framework_test
%test.quarkus.datasource.devservices.enabled=true
quarkus.kafka.devservices.enabled=false

# OUL (test)
oul.api.base-url=http://localhost:9999
kafka.subtopic=komplettering-test